name: Mainframe
description: >-
  Mainframe (Mainframe Group, Inc.) is a software development and marketing services company
  building products for the decentralized finance (DeFi) ecosystem. It offers three service areas
  — Risk Management (protocol parameter optimization and stability), Development (DeFi and
  blockchain financial solutions), and Marketing (brand reach and audience engagement) — and has
  produced projects including Hifi, Pooled NFT, Sheet Heads, and Crown Ribbon. It was surfaced as a
  portfolio company of a16z and Techstars and added to the API Evangelist network. Mainframe itself
  publishes only a three-page Webflow marketing site, with no API host and no developer portal
  (api., docs. and developer.mainframe.co do not resolve), and its MainframeHQ GitHub organization
  has zero public repositories. Its developer surface lives under its Hifi product instead — the
  docs.hifi.finance protocol documentation (footer copyright "Mainframe Group Inc."), the
  github.com/hifi-finance organization, five first-party npm packages in the @hifi scope, and a
  GraphQL subgraph schema for the Hifi lending protocol. That surface is a smart-contract SDK
  rather than an HTTP API — there is no REST API and no OpenAPI anywhere — and it has gone quiet,
  with the newest package release dated 2024-01-12 and the documented GraphQL endpoint on The
  Graph's retired hosted service returning HTTP 404.
