description: Mainframe (Mainframe Group, Inc.) is a software development and marketing
  services company building products for the decentralized finance (DeFi) ecosystem.
  It offers three service areas — Risk Management (protocol parameter optimization
  and stability), Development (DeFi and blockchain financial solutions), and Marketing
  (brand reach and audience engagement) — and has produced projects including Hifi,
  Pooled NFT, Sheet Heads, and Crown Ribbon. It was surfaced as a portfolio company
  of a16z and Techstars and added to the API Evangelist network. As of this enrichment
  pass Mainframe publishes a Webflow marketing site only, with no public API, developer
  portal, documentation, or SDKs.
