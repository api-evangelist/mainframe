apis:
- aid: mainframe:hifi-subgraph
  name: Hifi Protocol Subgraph
  description: >-
    The Graph subgraph that indexes the Hifi fixed-rate, fixed-term lending protocol — vaults,
    collateral and debt positions, listed bonds and collaterals, AMM pools and swaps — and serves
    them over GraphQL. This is the only machine-readable contract Mainframe publishes; the schema
    is captured verbatim in graphql/. WARNING: the endpoint Hifi's own documentation names is on
    The Graph's retired hosted service and returned HTTP 404 when probed 2026-08-13, and the docs
    name no replacement, so the surface is documented but not currently callable.
  humanURL: https://docs.hifi.finance/protocol/developers/data
  baseURL: https://thegraph.com/hosted-service/subgraph/hifi-finance/hifi
