  control_path: /this-path-does-not-exist-xyz
  control_status: 200
  control_bytes: 7792
  control_title: Mainframe
  detail: >-
    A deliberately nonsense path returns the same 200 / 7,792 bytes / <title>Mainframe</title> as
    every /.well-known/ path, which is how the catch-all was proven rather than assumed.
