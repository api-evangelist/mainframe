source: >-
  live GET of /.well-known/*, /llms.txt and common spec paths on every Mainframe host, plus the
  Hifi hosts Mainframe operates (mainframe.co lists Hifi as its own portfolio product and
  docs.hifi.finance carries the footer "Copyright (c) 2025 Mainframe Group Inc.")
summary: >-
  Mainframe publishes NO /.well-known/ discovery surface and no REST/OpenAPI contract of any
  kind, on any of its hosts. www.mainframe.co is a three-page Webflow marketing site whose hosting answers HTTP 200
  with the identical 7,792-byte homepage HTML for EVERY unknown path — a soft-200 catch-all. Every
  probe below returned 200 with `content-type: text/html`, `<title>Mainframe</title>` and byte-for-byte
  the same body as the homepage. NONE of them is a document, so NONE is a hit, and no WellKnown,
  SecurityTxt, LLMsTxt-from-provider or AgentCard pointer is emitted. Recorded here so a future
  round does not re-litigate a 200 that carries nothing.
soft_200_catch_all:
